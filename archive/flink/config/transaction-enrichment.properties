# Kafka
kafka.bootstrap.servers=kafka:9092
kafka.input.topic=transactions_raw
kafka.output.topic=transactions_enriched
kafka.dlq.topic=fraud_dlq
kafka.consumer.group=fraud-enrichment

# Event Time
watermark.delay.seconds=5

# Checkpoint
checkpoint.enabled=true
checkpoint.interval.ms=30000
checkpoint.timeout.ms=60000
checkpoint.min.pause.ms=5000
checkpoint.max.concurrent=1
checkpoint.path=file:///opt/flink/checkpoints/enrichment