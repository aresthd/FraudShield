# Kafka
kafka.bootstrap.servers=kafka:9092
kafka.transaction.topic=transactions_enriched
kafka.result.topic=fraud_results
kafka.alert.topic=fraud_alerts
kafka.rules.topic=fraud_rules
kafka.consumer.group=fraud-engine
kafka.rules.consumer.group=fraud-rules

# Event Time
watermark.delay.seconds=5

# Checkpoint
checkpoint.enabled=true
checkpoint.interval.ms=30000
checkpoint.timeout.ms=60000
checkpoint.min.pause.ms=5000
checkpoint.max.concurrent=1
checkpoint.path=file:///opt/flink/checkpoints/engine